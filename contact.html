      </div>
    </nav>

    <main class="adventure-main">
      <section class="content-section contact-section" id="contact">
        <div class="section-inner">
          <header class="section-heading">
            <p>QUEST COUNTER</p>
            <h1>お問い合わせ</h1>
          </header>

          <div class="contact-layout">
            <div class="contact-intro">
              <p>コース選びや学習について、気になることをお聞かせください。</p>
              <div class="contact-methods">
                <a class="line-button" href="http://lin.ee/YGo940D" target="_blank" rel="noopener noreferrer">LINEで相談する</a>
                <a class="mail-button" href="#contact-form">mailで相談する</a>
              </div>
              <img src="assets/images/math-monster.webp" alt="" width="1024" height="1024" loading="lazy" decoding="async" aria-hidden="true">
            </div>

            <form class="contact-form" id="contact-form" data-contact-form novalidate>
              <label>
                メールアドレス
                <input name="email" type="email" autocomplete="email" required>
              </label>

              <label>
                ご希望のコース
                <select name="course" required>
                  <option value="">選択してください</option>
                  <option>小学4年生 光コース</option>
                  <option>小学5年生 海コース</option>
                  <option>小学6年生 桜コース</option>
                  <option>パーソナル指導</option>
                  <option>まだ決めていない</option>
                </select>
              </label>

              <label>
                ご相談内容
                <textarea name="message" rows="5" required></textarea>
              </label>

              <button class="form-button" type="submit">
                <span aria-hidden="true">▶</span>
                <span data-submit-label>メールで送信する</span>
              </button>

              <p class="form-delivery-note">送信内容はメール送信サービスを経由して、代表の榎本 に直接届きます。</p>

              <div class="form-status" data-form-status role="status" aria-live="polite" hidden>
                <p class="form-status__title" data-form-status-title></p>
                <p class="form-status__message" data-form-status-message></p>
              </div>
            </form>
          </div>
        </div>
        <div class="section-return">
          <a class="return-menu-button" href="index.html"><span aria-hidden="true">◀</span> スタート画面に戻る</a>
        </div>
      </section>
